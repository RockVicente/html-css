<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 600px;
        }

        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        thead{
            position: sticky;
            top: -1px;
            background-color: rgb(149, 167, 193);
        }

        th{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        col.cnome{
            background-color:rgb(221, 229, 242) ;
        }

        col.csexo,col.cidade{
            background-color: rgb(196, 184, 184);
        }

        col.cprofissao{
            background-color: bisque;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissao">
        </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <th>NOME</th>
            <th>SEXO</th>
            <th>IDADE</th>
            <th>PROFISSAO</th>
        </thead>
        <tbody>
            <tr>
                <td>rock vicente</td>
                <td>M</td>
                <td>22</td>
                <td>Policia</td>
           </tr> 
            <tr>
                <td>vicente chooly</td>
                <td>M</td>
                <td>50</td>
                <td>Engenheiro de redes</td>
           </tr>
            <tr>
                <td>Neyd jose</td>
                <td>F</td>
                <td>19</td>
                <td>Estudante</td>
           </tr>
           <tr>
                <td>Sandra Goncalves</td>
                <td>F</td>
                <td>20 </td>
                <td>Policia</td>
           </tr>
        </tbody>
    </table>
</body>
</html>
