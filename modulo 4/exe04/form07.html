<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iset">Estado</label>
            <select name="estado" id="iset">
                <option value="" selected>----Escolha----</option>
                <optgroup label="sul">
                    <option value="Mp">Maputo Provincia</option>
                    <option value="Mc" selected>Maputo Cidade</option>
                    <option value="Ib">Inhambane</option>
                    <option value="Gz">Gaza</option>
                </optgroup>
                <optgroup label="centro">
                    <option value="Ma">Manica</option>
                    <option value="Sf">Sofala</option>
                    <option value="te">Tete</option>
                </optgroup>
                <optgroup label="norte">
                    <option value="Np">Nampula</option>
                    <option value="Cd">Cabo delgado</option>
                    <option value="Ns">Niassa</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissao</label>
            <input type="text" name="prof" id="iprof" list="lsprof">
            <datalist id="lsprof">
                <option>Administrador</option>
                <option>Contabilista</option>
                <option>Tecnico de informatica</option>
                <option>Professor</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Mensagem</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
