<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="isexmas">
            <label for="isexmas">Masculino</label><br>
            <input type="radio" name="sex" id="isexfem" checked>
            <label for="isexfem">Femenino</label>
        </fieldset>
        <fieldset>
            <legend>Espostes favoritos</legend>
            <input type="checkbox" name="bas" id="ibas">
            <label for="ibas">Basket</label> <br>
            <input type="checkbox" name="fut" id="ifut" checked>
            <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="nat" id="inat">
            <label for="inat">Natacao</label> <br>
            <input type="checkbox" name="ten" id="iten">
            <label for="iten">Tenis</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
